<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Milky Mist — HR Portal Login</title>
    <link rel="stylesheet" href="/static/style.css?v=8">
    <style>
        body.login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 50% 15%, #EFF6FF 0%, #F1F5F9 100%);
            padding: 1.5rem;
        }

        .login-card {
            width: 100%;
            max-width: 440px;
            background: #FFFFFF;
            border: 1px solid #E2E8F0;
            border-radius: 12px;
            padding: 2.25rem 2rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-brand-box {
            background: #FFFFFF;
            border: 1px solid #E2E8F0;
            border-radius: 10px;
            padding: 0.75rem 1.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            margin: 0 auto 1.5rem;
            max-width: 200px;
        }

        .login-brand-logo {
            width: 100%;
            max-height: 42px;
            object-fit: contain;
            display: block;
        }

        .login-header {
            text-align: center;
            margin-bottom: 1.75rem;
        }

        .login-header h1 {
            font-size: 1.35rem;
            font-weight: 700;
            color: #0F172A;
            letter-spacing: -0.01em;
        }

        .login-header p {
            font-size: 0.825rem;
            color: #64748B;
            margin-top: 0.35rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: #475569;
            margin-bottom: 0.4rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 0.85rem;
            color: #94A3B8;
            pointer-events: none;
        }

        .form-control {
            width: 100%;
            background: #FFFFFF;
            border: 1px solid #CBD5E1;
            border-radius: 6px;
            padding: 0.7rem 0.85rem 0.7rem 2.6rem;
            color: #0F172A;
            font-size: 0.9rem;
            outline: none;
            transition: all 0.15s ease;
        }

        .form-control:focus {
            border-color: #2563EB;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .login-alert {
            display: flex;
            background: #FEF2F2;
            border: 1px solid #FECACA;
            color: #991B1B;
            padding: 0.75rem 1rem;
            border-radius: 6px;
            font-size: 0.825rem;
            margin-bottom: 1.25rem;
            align-items: center;
            gap: 0.6rem;
        }

        .login-btn {
            width: 100%;
            background: #2563EB;
            color: #FFFFFF;
            font-weight: 600;
            font-size: 0.925rem;
            padding: 0.75rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }

        .login-btn:hover {
            background: #1D4ED8;
        }

        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .quick-accounts-card {
            margin-top: 1.75rem;
            padding-top: 1.25rem;
            border-top: 1px dashed #CBD5E1;
            font-size: 0.775rem;
            color: #64748B;
            text-align: center;
        }

        .quick-btn-group {
            display: flex;
            gap: 0.5rem;
            justify-content: center;
            margin-top: 0.6rem;
        }

        .quick-btn {
            background: #F1F5F9;
            border: 1px solid #CBD5E1;
            color: #2563EB;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 0.35rem 0.7rem;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .quick-btn:hover {
            background: #EFF6FF;
            border-color: #2563EB;
        }
    </style>

    <!-- React 18 & Babel Standalone -->
    <script src="/static/vendor/react.production.min.js"></script>
    <script src="/static/vendor/react-dom.production.min.js"></script>
    <script src="/static/vendor/babel.min.js"></script>
</head>
<body class="login-page">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        function AdminLoginApp() {
            const [username, setUsername] = useState('');
            const [password, setPassword] = useState('');
            const [errorMsg, setErrorMsg] = useState('');
            const [isLoading, setIsLoading] = useState(false);

            const fillCredentials = (user, pass) => {
                setUsername(user);
                setPassword(pass);
                setErrorMsg('');
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                setErrorMsg('');

                if (!username.trim() || !password) return;

                setIsLoading(true);

                try {
                    const res = await fetch('/api/auth/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username: username.trim(), password })
                    });

                    const data = await res.json();

                    if (!res.ok || !data.success) {
                        throw new Error(data.detail || data.message || 'Invalid username or password.');
                    }

                    // Successfully authenticated -> redirect to dashboard
                    window.location.href = '/';
                } catch (err) {
                    setErrorMsg(err.message || 'Login failed. Please check credentials.');
                    setIsLoading(false);
                }
            };

            return (
                <div className="login-card">
                    <div className="login-brand-box">
                        <img src="/static/logo.jpg" alt="Milky Mist Logo" className="login-brand-logo" />
                    </div>

                    <div className="login-header">
                        <h1>HR Portal Login</h1>
                        <p>Milky Mist Internal Human Resources & Recruitment</p>
                    </div>

                    {errorMsg && (
                        <div className="login-alert">
                            <svg viewBox="0 0 20 20" width="16" height="16" fill="currentColor">
                                <path fillRule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clipRule="evenodd" />
                            </svg>
                            <span>{errorMsg}</span>
                        </div>
                    )}

                    <form onSubmit={handleSubmit}>
                        <div className="form-group">
                            <label className="form-label" htmlFor="usernameInput">Username</label>
                            <div className="input-wrapper">
                                <svg className="input-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" strokeWidth="2">
                                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                    <circle cx="12" cy="7" r="4"></circle>
                                </svg>
                                <input
                                    type="text"
                                    id="usernameInput"
                                    className="form-control"
                                    placeholder="e.g. dev123 or admin123"
                                    required
                                    autoComplete="username"
                                    autoFocus
                                    value={username}
                                    onChange={(e) => setUsername(e.target.value)}
                                />
                            </div>
                        </div>

                        <div className="form-group">
                            <label className="form-label" htmlFor="passwordInput">Password</label>
                            <div className="input-wrapper">
                                <svg className="input-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" strokeWidth="2">
                                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                                </svg>
                                <input
                                    type="password"
                                    id="passwordInput"
                                    className="form-control"
                                    placeholder="••••••"
                                    required
                                    autoComplete="current-password"
                                    value={password}
                                    onChange={(e) => setPassword(e.target.value)}
                                />
                            </div>
                        </div>

                        <button type="submit" className="login-btn" disabled={isLoading}>
                            <span>{isLoading ? 'Signing in...' : 'Sign In to Portal'}</span>
                        </button>
                    </form>

                    <div className="quick-accounts-card">
                        <span>Click to auto-fill default credentials:</span>
                        <div className="quick-btn-group">
                            <button
                                type="button"
                                className="quick-btn"
                                onClick={() => fillCredentials('dev123', '123456')}
                            >
                                dev123 (Developer)
                            </button>
                            <button
                                type="button"
                                className="quick-btn"
                                onClick={() => fillCredentials('admin123', '123456')}
                            >
                                admin123 (HR Admin)
                            </button>
                            <button
                                type="button"
                                className="quick-btn"
                                onClick={() => fillCredentials('test123', '123456')}
                            >
                                test123 (Staff User)
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AdminLoginApp />);
    </script>
</body>
</html>
